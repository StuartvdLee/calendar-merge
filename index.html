<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICS Merger</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171c23;
    --border: #2a323d;
    --text: #e6eaf0;
    --muted: #93a1b3;
    --accent: #4c8dff;
    --accent-hover: #3f7bec;
    --danger: #ff6b6b;
    --ok: #3ddc97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  #drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 16px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  #drop:hover { border-color: var(--accent); }
  #drop.over {
    border-color: var(--accent);
    background: rgba(76, 141, 255, .08);
    color: var(--text);
  }
  #drop strong { color: var(--text); }
  ul#files { list-style: none; margin: 16px 0 0; padding: 0; max-height: 220px; overflow-y: auto; }
  ul#files li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  ul#files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul#files .meta { color: var(--muted); flex: none; }
  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #progressWrap { margin-top: 18px; display: none; }
  #progressWrap.show { display: block; }
  .bar { height: 8px; background: #0b0e12; border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .bar > div {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform .15s ease;
  }
  #status { margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 20px; }
  #status.error { color: var(--danger); }
  #status.done { color: var(--ok); }
  a#download {
    display: none;
    margin-top: 16px;
    padding: 10px 18px;
    border-radius: 9px;
    background: var(--ok);
    color: #09240f;
    font-weight: 700;
    text-decoration: none;
    text-align: center;
  }
  a#download.show { display: block; }
</style>
</head>
<body>
<main class="app">
  <h1>ICS Merger</h1>
  <p class="sub">Combine multiple calendar files into one <code>merged.ics</code> ready for Google Calendar import.</p>

  <div id="drop" tabindex="0" role="button" aria-label="Drop .ics files here or click to browse">
    <strong>Drop .ics files here</strong><br>or click to browse
  </div>
  <input type="file" id="picker" accept=".ics,text/calendar" multiple hidden>

  <ul id="files"></ul>

  <div class="row">
    <button id="merge" class="primary" disabled>Start merge</button>
    <button id="clear" disabled>Clear files</button>
  </div>

  <div id="progressWrap">
    <div class="bar"><div id="bar"></div></div>
    <div id="status"></div>
  </div>

  <a id="download" download="merged.ics">Download merged.ics</a>
</main>

<script>
(() => {
  const dropEl = document.getElementById('drop');
  const pickerEl = document.getElementById('picker');
  const listEl = document.getElementById('files');
  const mergeBtn = document.getElementById('merge');
  const clearBtn = document.getElementById('clear');
  const progressWrap = document.getElementById('progressWrap');
  const barEl = document.getElementById('bar');
  const statusEl = document.getElementById('status');
  const downloadEl = document.getElementById('download');

  let files = [];
  let downloadUrl = null;
  let busy = false;

  const CRLF = '\r\n';
  const CONTAINERS = new Set(['VEVENT', 'VTODO', 'VJOURNAL', 'VFREEBUSY', 'VTIMEZONE']);

  function unfold(text) {
    return text
      .replace(/^\uFEFF/, '')
      .replace(/\r\n|\r|\n/g, '\n')
      .replace(/\n[ \t]/g, '')
      .split('\n');
  }

  function foldLine(line) {
    const bytes = new TextEncoder().encode(line);
    if (bytes.length <= 75) return line;
    const out = [];
    let chunk = '';
    let chunkBytes = 0;
    let limit = 75;
    for (const ch of line) {
      const size = new TextEncoder().encode(ch).length;
      if (chunkBytes + size > limit) {
        out.push(chunk);
        chunk = ch;
        chunkBytes = size;
        limit = 74; // continuation lines start with a leading space
      } else {
        chunk += ch;
        chunkBytes += size;
      }
    }
    out.push(chunk);
    return out[0] + out.slice(1).map(c => CRLF + ' ' + c).join('');
  }

  function propName(line) {
    const idx = line.search(/[;:]/);
    return (idx === -1 ? line : line.slice(0, idx)).trim().toUpperCase();
  }

  function propValue(line) {
    const idx = line.indexOf(':');
    return idx === -1 ? '' : line.slice(idx + 1);
  }

  // Extracts top-level components from one calendar file.
  function parseCalendar(lines) {
    const components = [];
    let current = null;
    let depth = 0;

    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      const name = propName(line);

      if (name === 'BEGIN') {
        const type = propValue(line).trim().toUpperCase();
        if (type === 'VCALENDAR') continue;
        if (current) {
          depth++;
          current.lines.push(line);
        } else if (CONTAINERS.has(type)) {
          current = { type, lines: [line] };
          depth = 0;
        }
        continue;
      }

      if (name === 'END') {
        const type = propValue(line).trim().toUpperCase();
        if (type === 'VCALENDAR') continue;
        if (!current) continue;
        current.lines.push(line);
        if (depth > 0) {
          depth--;
        } else {
          components.push(current);
          current = null;
        }
        continue;
      }

      if (current) current.lines.push(line);
    }

    return components;
  }

  function findProp(component, wanted) {
    for (const line of component.lines) {
      if (propName(line) === wanted) return propValue(line).trim();
    }
    return '';
  }

  function replaceProp(component, wanted, newValue) {
    component.lines = component.lines.map(line => {
      if (propName(line) !== wanted) return line;
      const idx = line.indexOf(':');
      return line.slice(0, idx + 1) + newValue;
    });
  }

  const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

  function setProgress(pct, message, state) {
    barEl.style.transform = 'scaleX(' + Math.max(0, Math.min(100, pct)) / 100 + ')';
    statusEl.textContent = message;
    statusEl.className = state || '';
  }

  function renderFiles() {
    listEl.innerHTML = '';
    for (const file of files) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = file.name;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = (file.size / 1024).toFixed(1) + ' KB';
      li.append(name, meta);
      listEl.appendChild(li);
    }
    const has = files.length > 0;
    mergeBtn.disabled = !has || busy;
    clearBtn.disabled = !has || busy;
  }

  function addFiles(incoming) {
    const accepted = Array.from(incoming).filter(f =>
      /\.ics$/i.test(f.name) || f.type === 'text/calendar'
    );
    const skipped = incoming.length - accepted.length;

    for (const file of accepted) {
      const dupe = files.some(f =>
        f.name === file.name && f.size === file.size && f.lastModified === file.lastModified
      );
      if (!dupe) files.push(file);
    }

    resetOutput();
    renderFiles();

    if (skipped > 0) {
      progressWrap.classList.add('show');
      setProgress(0, skipped + ' file(s) ignored — only .ics files are supported.', 'error');
    }
  }

  function resetOutput() {
    if (downloadUrl) {
      URL.revokeObjectURL(downloadUrl);
      downloadUrl = null;
    }
    downloadEl.classList.remove('show');
    downloadEl.removeAttribute('href');
    progressWrap.classList.remove('show');
    setProgress(0, '');
  }

  async function merge() {
    busy = true;
    mergeBtn.disabled = true;
    clearBtn.disabled = true;
    resetOutput();
    progressWrap.classList.add('show');
    setProgress(0, 'Starting…');
    await nextFrame();

    const timezones = new Map();
    const seen = new Map(); // UID|RECURRENCE-ID -> serialized body
    const output = [];
    let eventCount = 0;
    let duplicates = 0;
    let renamed = 0;

    try {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        setProgress((i / files.length) * 100, `Reading ${file.name} (${i + 1}/${files.length})…`);
        await nextFrame();

        const text = await file.text();
        if (!/BEGIN:VCALENDAR/i.test(text)) {
          throw new Error(`${file.name} is not a valid iCalendar file.`);
        }

        const components = parseCalendar(unfold(text));

        for (const component of components) {
          if (component.type === 'VTIMEZONE') {
            const tzid = findProp(component, 'TZID');
            if (tzid && !timezones.has(tzid)) timezones.set(tzid, component);
            continue;
          }

          const uid = findProp(component, 'UID');
          const recurrenceId = findProp(component, 'RECURRENCE-ID');
          const body = component.lines.join('\n');

          if (uid) {
            const key = uid + '||' + recurrenceId;
            const existing = seen.get(key);
            if (existing === body) {
              duplicates++;
              continue;
            }
            if (existing !== undefined) {
              // Same UID, different content: keep both with a unique UID.
              let suffix = 2;
              let candidate;
              do {
                candidate = `${uid}-merged-${suffix++}`;
              } while (seen.has(candidate + '||' + recurrenceId));
              replaceProp(component, 'UID', candidate);
              seen.set(candidate + '||' + recurrenceId, component.lines.join('\n'));
              renamed++;
            } else {
              seen.set(key, body);
            }
          }

          output.push(component);
          eventCount++;
        }

        setProgress(((i + 1) / files.length) * 100, `Merged ${file.name}.`);
        await nextFrame();
      }

      if (eventCount === 0) throw new Error('No calendar entries found in the selected files.');

      setProgress(100, 'Writing merged.ics…');
      await nextFrame();

      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//ICS Merger//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        ...[...timezones.values()].flatMap(c => c.lines),
        ...output.flatMap(c => c.lines),
        'END:VCALENDAR'
      ];

      const ics = lines.map(foldLine).join(CRLF) + CRLF;
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      downloadUrl = URL.createObjectURL(blob);
      downloadEl.href = downloadUrl;
      downloadEl.classList.add('show');

      const notes = [`${eventCount} entr${eventCount === 1 ? 'y' : 'ies'} from ${files.length} file(s)`];
      if (timezones.size) notes.push(`${timezones.size} timezone(s)`);
      if (duplicates) notes.push(`${duplicates} duplicate(s) removed`);
      if (renamed) notes.push(`${renamed} UID conflict(s) renamed`);
      setProgress(100, 'Done — ' + notes.join(', ') + '.', 'done');
    } catch (err) {
      setProgress(100, 'Merge failed: ' + err.message, 'error');
      barEl.style.transform = 'scaleX(0)';
    } finally {
      busy = false;
      renderFiles();
    }
  }

  dropEl.addEventListener('click', () => pickerEl.click());
  dropEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      pickerEl.click();
    }
  });
  pickerEl.addEventListener('change', () => {
    addFiles(pickerEl.files);
    pickerEl.value = '';
  });

  ['dragenter', 'dragover'].forEach(type =>
    dropEl.addEventListener(type, e => {
      e.preventDefault();
      dropEl.classList.add('over');
    })
  );
  ['dragleave', 'drop'].forEach(type =>
    dropEl.addEventListener(type, e => {
      e.preventDefault();
      dropEl.classList.remove('over');
    })
  );
  dropEl.addEventListener('drop', e => {
    if (busy) return;
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  mergeBtn.addEventListener('click', () => { if (!busy && files.length) merge(); });
  clearBtn.addEventListener('click', () => {
    if (busy) return;
    files = [];
    resetOutput();
    renderFiles();
  });

  renderFiles();
})();
</script>
</body>
</html>
